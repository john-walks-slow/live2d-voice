name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, plat: win-x64 }
          - { os: ubuntu-latest, plat: linux-x64 }
          - { os: ubuntu-24.04-arm, plat: linux-arm64 }
          - { os: macos-latest, plat: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install launcher deps
        run: npm install --no-audit --no-fund
      - name: Build portable bundle
        shell: bash
        run: bash scripts/build-portable.sh ${{ matrix.plat }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: live2d-voice-${{ matrix.plat }}
          path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
